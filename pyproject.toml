[project]
name = "RAG"
version = "0.1.0"
description = "RAG: Retrieval-Augmented Generation"
requires-python = ">=3.10"

dependencies = [
    "torch>=2.12.0",
    "transformers>=5.12.1",
    "huggingface-hub>=0.20.0",
    "numpy>=1.24",
    "pydantic>=2.0",
    "tqdm>=4.68.3",
    "fire>=0.7.1",
    "rank-bm25>=0.2.2",
    "tqdm>=4.68.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.mypy.overrides]]
module = "llm_sdk.*"
ignore_errors = true

[tool.hatch.build.targets.wheel]
packages = ["llm_sdk"]